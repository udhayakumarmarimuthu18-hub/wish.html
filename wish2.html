<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
    <link rel="stylesheet" href="wish2.css">
</head>
<body>
    <div class="page2">
        <!-- Heart outlines -->
        <div class="heart h1">♡</div>
        <div class="heart h2">♡</div>
        <div class="heart h3">♡</div>
        <div class="heart h4">♡</div>
        <div class="heart h5">♡</div>
        <div class="heart h6">♡</div>
        <!-- Toy -->
        <div class="toy-area">
            <img src="toy.png"
                 alt="Cute toy"
                 class="toy">
        </div>
        <!-- Birthday message -->
        <div class="message">
           <p class="little-text">
                A little something for you...
            </p>
            <h1>
                Happy Birthday ❤️
            </h1>
            <p class="birthday-text">
                I hope your day is filled with
                happiness, beautiful moments,
                and lots of reasons to smile.
            </p>
            <p class="birthday-text">
                You deserve all the good things
                that life has to offer. ✨
            </p>
            <div class="heart-line">
                ♡ ♡ ♡
            </div>
        </div>
    </div>
</body>
</html>
